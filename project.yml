name: Chronoscope
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ChronoscopeCore:
    path: Core
targets:
  Chronoscope:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources, Info-iOS.plist, Info-macOS.plist]
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: ChronoscopeCore
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Chronoscope
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.chronoscope.ios
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
